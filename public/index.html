<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WebBoard - Доска объявлений</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/" style="font-weight:bold;">Главная</a>
            <a href="/create-ad">Создать объявление</a>
            <a href="/my-ads">Мои объявления</a>
            <a href="/admin" id="adminLink" style="display:none;">🔧 Админ-панель</a>

            <!-- ЕДИНЫЙ БЛОК ДЛЯ ВСЕХ ССЫЛОК -->
            <div id="auth-links" style="margin-left:auto; display:flex; gap:1rem;">
                <a href="/login">Вход</a>
                <a href="/register">Регистрация</a>
            </div>

            <!-- Блок для авторизованных -->
            <div id="user-info" style="display:none; margin-left:auto; gap:1rem; align-items:center;">
                <span id="username"></span>
                <a href="/logout" id="logoutBtn" style="color:white;">Выйти</a>
            </div>
        </nav>
    </header>

<div class="container">
    <h1>📢 Все объявления</h1>
    
    <!-- Фильтры -->
    <div style="display:flex; gap:1rem; flex-wrap:wrap; margin:1rem 0; padding:1rem; background:#f8f9fa; border-radius:8px;">
        <div>
            <label>Категория:</label>
            <select id="categoryFilter">
                <option value="">Все</option>
                <!-- загружаются через JS -->
            </select>
        </div>
        <div>
            <label>Сортировка:</label>
            <select id="sortFilter">
                <option value="new">Сначала новые</option>
                <option value="old">Сначала старые</option>
            </select>
        </div>
        <button id="applyFilters" style="background:#2c3e50;">Применить</button>
    </div>

    <div id="ads-list">Загрузка...</div>
</div>

    <script src="/js/global.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
