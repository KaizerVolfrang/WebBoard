<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход - WebBoard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/">Главная</a>
            <a href="/create-ad">Создать объявление</a>
            <a href="/my-ads">Мои объявления</a>
            <a href="/admin" id="adminLink" style="display:none;">🔧 Админ-панель</a>

            <!-- ЕДИНЫЙ БЛОК ДЛЯ ВСЕХ ССЫЛОК -->
            <div id="auth-links" style="margin-left:auto; display:flex; gap:1rem;">
                <a href="/login" style="font-weight:bold;">Вход</a>
                <a href="/register">Регистрация</a>
            </div>

            <!-- Блок для авторизованных (скрыт, пока не вошли) -->
            <div id="user-info" style="display:none; margin-left:auto; gap:1rem; align-items:center;">
                <span id="username"></span>
                <a href="/logout" id="logoutBtn" style="color:white;">Выйти</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1>Вход</h1>

        <form id="loginForm">
            <div>
                <input type="text" id="login" placeholder="Логин" required>
            </div>
            <br>
            <div>
                <input type="password" id="password" placeholder="Пароль" required>
            </div>
            <br>
            <button type="submit">Войти</button>
        </form>

        <p id="message"></p>

        <p><a href="/register">Нет аккаунта? Зарегистрироваться</a></p>
    </div>

    <script src="/js/global.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
