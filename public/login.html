<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>

<body>

    <h1>Вход</h1>

    <form id="loginForm">

        <div>
            <input
                type="text"
                id="login"
                placeholder="Логин"
                required>
        </div>

        <br>

        <div>
            <input
                type="password"
                id="password"
                placeholder="Пароль"
                required>
        </div>

        <br>

        <button type="submit">
            Войти
        </button>

    </form>

    <p id="message"></p>

    <script src="/js/login.js"></script>

</body>

</html>
