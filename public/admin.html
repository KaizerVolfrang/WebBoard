<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Админ-панель - WebBoard</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="/">Главная</a>
        <a href="/create-ad">Создать объявление</a>
        <a href="/my-ads">Мои объявления</a>
        <a href="/admin" id="adminLink" style="color: #f1c40f"
          >🔧 Админ-панель</a
        >
        <a href="/admin-permissions" style="color: #e67e22;">🛡️ Управление разрешениями</a>

        <!-- Блок для неавторизованных (в админке он скрыт всегда) -->
        <div id="auth-links" style="display: none">
          <a href="/login">Вход</a>
          <a href="/register">Регистрация</a>
        </div>

        <!-- Блок для авторизованных (в админке всегда виден) -->
        <div
          id="user-info"
          style="
            display: flex;
            margin-left: auto;
            gap: 1rem;
            align-items: center;
          "
        >
          <span id="username"></span>
          <a href="/logout" id="logoutBtn" style="color: white">Выйти</a>
        </div>
      </nav>
    </header>

    <div class="admin-container">
      <h1>🔧 Админ-панель</h1>

      <!-- Ссылка на управление категориями -->
      <div style="margin-bottom: 1rem;">
        <a href="/admin-categories" style="color: #3498db;">📂 Управление категориями</a>
      </div>

      <div class="tabs">
        <span class="tab active" data-tab="all">Все</span>
        <span class="tab" data-tab="pending">На модерации</span>
        <span class="tab" data-tab="approved">Одобренные</span>
        <span class="tab" data-tab="rejected">Отклонённые</span>
        <span class="tab" data-tab="statistics">📊 Статистика</span>
      </div>

      <div id="ads-list">Загрузка...</div>

      <!-- ===== СТАТИСТИКА (теперь в body, а не в header) ===== -->
      <div id="statistics-container" style="display: none;">
        <h2>📊 Статистика</h2>
        <div id="statistics-content">Загрузка...</div>
      </div>
    </div>

    <script src="/js/global.js"></script>
    <script src="/js/admin.js"></script>
  </body>
</html>
