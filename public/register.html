<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>

<body>

    <h1>Регистрация</h1>

    <form id="registerForm">

        <div>
            <input
                type="text"
                id="login"
                placeholder="Логин"
                required>
        </div>

        <br>

        <div>
            <input
                type="email"
                id="email"
                placeholder="Email"
                required>
        </div>

        <br>

        <div>
            <input
                type="password"
                id="password"
                placeholder="Пароль"
                required>
        </div>

        <br>

        <button type="submit">
            Зарегистрироваться
        </button>

    </form>

    <p id="message"></p>

    <script src="/js/register.js"></script>

</body>
</html>
