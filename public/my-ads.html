<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мои объявления - WebBoard</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <header>
        <nav>
            <a href="/">Главная</a>
            <a href="/create-ad">Создать объявление</a>
            <a href="/my-ads">Мои объявления</a>
            <a href="/admin" id="adminLink" style="display:none;">🔧 Админ-панель</a>

            <!-- Блок для неавторизованных -->
            <div id="auth-links">
                <a href="/login">Вход</a>
                <a href="/register">Регистрация</a>
            </div>

            <!-- Блок для авторизованных (управляется через global.js) -->
            <div id="user-info" style="display:none; margin-left:auto; gap:1rem; align-items:center;">
                <span id="username"></span>
                <a href="/logout" id="logoutBtn" style="color:white;">Выйти</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1>📋 Мои объявления</h1>
        <div id="ads-list">Загрузка...</div>
    </div>

    <script src="/js/global.js"></script>
    <script src="/js/my-ads.js"></script>
</body>
</html>
